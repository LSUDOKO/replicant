[profile.default]
src = "contracts"
out = "out"
test = "test"
cache_path = "cache_forge"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[rpc_endpoints]
zero_g_galileo = "${ZERO_G_GALILEO_RPC_URL}"
zero_g_mainnet = "${ZERO_G_MAINNET_RPC_URL}"
